<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The renderer makes no network requests itself: all HTTP goes through main over IPC.
         'unsafe-inline' styles: Vite's dev server injects CSS as <style> tags. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:"
    />
    <title>hive</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
